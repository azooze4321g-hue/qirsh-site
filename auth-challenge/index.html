<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com about:; connect-src https://challenges.cloudflare.com; style-src 'unsafe-inline'; img-src data: https://challenges.cloudflare.com; base-uri 'none'; form-action 'none'">
<title>Qirsh verification</title>
<style>
html{color:#29251f;background:transparent}html.dark{color:#f5f2eb}
body{margin:0;padding:12px 16px;font:16px/24px system-ui,sans-serif;background:transparent}
#challenge{display:flex;justify-content:center}#status{margin:0 0 12px;text-align:center;min-height:24px}
#status.checking::before{content:'';display:inline-block;width:12px;height:12px;margin-inline-end:8px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;vertical-align:-2px;animation:checking 1s linear infinite}
@keyframes checking{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#status.checking::before{animation:none}}
</style>
</head>
<body>
<p id="status" role="status">Loading verification…</p>
<div id="challenge"></div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.hash.slice(1));
  var attempt = params.get('attempt') || '';
  var action = params.get('action') || '';
  var siteKey = params.get('key') || '';
  var lang = params.get('lang') === 'ar' ? 'ar' : 'en';
  var theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.className = theme;
  var status = document.getElementById('status');
  status.textContent = lang === 'ar' ? 'جاري تحميل التحقّق…' : 'Loading verification…';
  function send(type, value) {
    var message = { version: 1, attemptId: attempt, type: type };
    if (type === 'token') message.token = value;
    if (type === 'phase') message.phase = value;
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
  }
  function phase(value) {
    status.className = value;
    status.textContent = value === 'interactive'
      ? (lang === 'ar' ? 'كمّل التحقّق عشان تتابع.' : 'Complete the check to continue.')
      : (lang === 'ar' ? 'جاري التحقّق…' : 'Checking…');
    send('phase', value);
  }
  window.qirshChallengeLoaded = function () {
    if (!/^[A-Za-z0-9-]{1,80}$/.test(attempt) || !/^[A-Za-z0-9_-]{3,128}$/.test(siteKey)
      || ['sign_in', 'sign_up', 'password_reset'].indexOf(action) === -1) { send('error'); return; }
    phase('checking');
    window.turnstile.render('#challenge', {
      // Flexible needs 300px plus the page's 32px padding; compact is 150x140px.
      sitekey: siteKey, action: action, language: lang, theme: theme, size: window.innerWidth < 332 ? 'compact' : 'flexible',
      appearance: 'interaction-only',
      retry: 'never', 'refresh-expired': 'never', 'refresh-timeout': 'never',
      callback: function (token) { send('token', token); },
      'before-interactive-callback': function () { phase('interactive'); },
      'after-interactive-callback': function () { phase('checking'); },
      'expired-callback': function () { send('expired'); },
      'error-callback': function () { send('error'); },
      'timeout-callback': function () { send('expired'); },
      'unsupported-callback': function () { send('error'); }
    });
  };
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=qirshChallengeLoaded&amp;render=explicit" async defer></script>
</body>
</html>
